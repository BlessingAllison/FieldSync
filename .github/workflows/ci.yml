name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · migrations · pytest · OpenAPI drift)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fieldsync
          POSTGRES_USER: fieldsync
          POSTGRES_PASSWORD: fieldsync
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldsync -d fieldsync"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@127.0.0.1:5434/fieldsync
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - name: No missing migrations
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py makemigrations --check --dry-run
      - name: Tests (real PostgreSQL)
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Lockfile is current
        run: |
          pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe --output-file /tmp/requirements.lock pyproject.toml
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
      - name: Dependency audit
        run: pip-audit --strict -r requirements.lock

  frontend:
    name: Frontend (eslint · tsc · contracts · vitest · build · size budgets)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated contracts are current
        run: npm run contracts:check
      - run: npm test
      - run: npm run build:bundle
      - name: Bundle budgets
        run: npm run size

  e2e:
    name: E2E (compose stack · Playwright · axe)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate .env
        run: python3 scripts/bootstrap_env.py
      - name: Start stack
        env:
          THROTTLE_LOGIN: 600/min # many sign-ins from one runner IP
        run: docker compose up -d --build --wait
      - name: Seed synthetic demo data
        run: docker compose exec -T api python manage.py seed_demo --password "e2e-Demo-Password-2026" --reset-device-states > /dev/null
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8090
          E2E_PASSWORD: e2e-Demo-Password-2026
        run: npm run e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color api web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
