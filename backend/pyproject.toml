[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fieldsync"
version = "0.1.0"
description = "FieldSync API — offline-first health data collection backend (demonstration project)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "Django==5.2.8",
  "djangorestframework==3.16.1",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.28.0",
  "drf-spectacular-sidecar==2025.10.1",
  "psycopg[binary]==3.2.10",
  "gunicorn==23.0.0",
  "whitenoise==6.9.0",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.0",
  "jsonschema==4.23.0",
  "django-stubs-ext==5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-django==4.9.0",
  "pytest-cov==6.0.0",
  "hypothesis==6.123.0",
  "freezegun==1.5.1",
  "ruff==0.8.4",
  "django-stubs[compatible-mypy]==5.2.0",
  "djangorestframework-stubs[compatible-mypy]==3.16.0",
  "types-jsonschema==4.23.0.20241208",
  "pip-audit==2.7.3",
  "pip-tools==7.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fieldsync", "config"]

# ───────────────────────── Ruff ─────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "DJ", "PT", "TID", "C4", "PIE", "RET", "PL",
]
ignore = [
  "PLR0913",  # explicit keyword-only signatures are clearer than config bags
  "PLR2004",  # protocol constants (HTTP statuses) read better inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "E501"]
# Error-code enum members such as TOKEN_INVALID are identifiers, not credentials.
"fieldsync/common/errors.py" = ["S105"]
# Settings modules read many env vars; star-import is the Django convention for layering.
"config/settings/*.py" = ["F403", "F405"]
# Django's Meta.indexes/constraints lists are framework conventions, not shared mutable state.
"fieldsync/*/models.py" = ["RUF012"]
# Synthetic seed data deliberately uses a seeded, reproducible PRNG.
"fieldsync/demo/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ───────────────────────── Mypy ─────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*", "prometheus_client.*", "whitenoise.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ───────────────────────── Pytest ─────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: test needs the PostgreSQL test database",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["fieldsync", "config"]
branch = true
omit = ["*/migrations/*", "config/wsgi.py"]
