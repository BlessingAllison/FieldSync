include /etc/nginx/snippets/common-headers.conf;
# Strict CSP for the PWA (ADD §11.6): no inline script, no third-party origins.
# React and Motion set styles through the CSSOM, which style-src does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
