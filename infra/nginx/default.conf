# FieldSync web tier: serves the built PWA and proxies /api to Django on the same origin
# (no CORS, SameSite=Strict refresh cookie — ADD D6). TLS terminates in front of this in
# production; see infra/nginx/tls.conf.example.

upstream fieldsync_api {
  server api:8000;
  keepalive 16;
}

map $http_x_request_id $fs_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types application/javascript application/json application/manifest+json text/css image/svg+xml text/plain;

  # Compressed sync batches are ≤ 1 MB raw; Django enforces the decompressed cap.
  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    include /etc/nginx/snippets/common-headers.conf;
    # Django sets these too; hide the upstream copies so each header appears exactly once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_pass http://fieldsync_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port: Django's same-origin check on the refresh endpoint compares
    # the Origin header (scheme://host:port) with the Host it sees.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $fs_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # Never buffer health data to disk on the proxy.
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;
  }

  # Must be revalidated on every load so updates are discovered (ADD §12.11).
  location = /sw.js {
    include /etc/nginx/snippets/pwa-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/pwa-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Content-hashed build output: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/pwa-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # App shell and everything else: SPA fallback, always revalidated.
  location / {
    include /etc/nginx/snippets/pwa-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
